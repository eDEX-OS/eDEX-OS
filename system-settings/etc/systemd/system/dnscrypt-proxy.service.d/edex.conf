[Service]
# Seed the resolver-list cache from the signed copy shipped in edex-os-settings, so the proxy starts
# (and DNS works) even when the list cannot be downloaded: offline, captive portals, or networks
# that block the list's hosts. An outdated cache is still used; the proxy refreshes it online.
ExecStartPre=/bin/sh -c 'for f in public-resolvers.md public-resolvers.md.minisig; do [ -s "$$CACHE_DIRECTORY/$$f" ] || cp /usr/share/edex-os/dnscrypt/$$f "$$CACHE_DIRECTORY/"; done'
ExecStart=
ExecStart=/usr/bin/dnscrypt-proxy --config /etc/edex-os/dnscrypt-proxy.toml
