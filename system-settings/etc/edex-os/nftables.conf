#!/usr/bin/nft -f
# eDEX-OS baseline firewall: deny inbound, allow Tailscale, forward only for Tailscale exit-node use.
# This file owns only `table inet edex-filter`; it never flushes the ruleset so that the Tor
# transparent-mode table (`inet edex-tor`) and Tailscale's own tables survive reloads.

table inet edex-filter
delete table inet edex-filter

table inet edex-filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept
        iifname "tailscale0" accept
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept
        udp dport 68 accept
        udp dport 546 accept
        udp dport 5353 ip daddr 224.0.0.251 accept
        udp dport 41641 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname "tailscale0" accept
        oifname "tailscale0" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
