LABEL edex-os
TEXT HELP
Boot the eDEX-OS live medium (BIOS). Install from the desktop with the INSTALL button.
ENDTEXT
MENU LABEL eDEX-OS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_priority=3 systemd.firstboot=off %KERNEL_PARAMS%

LABEL edex-os-copytoram
TEXT HELP
Copy the whole medium to RAM first; the USB stick or DVD can be removed after boot.
ENDTEXT
MENU LABEL eDEX-OS live - copy to RAM
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram quiet splash loglevel=3 systemd.firstboot=off %KERNEL_PARAMS%

LABEL edex-os-nomodeset
TEXT HELP
Safe graphics mode for problematic GPUs.
ENDTEXT
MENU LABEL eDEX-OS live - safe graphics (nomodeset)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset systemd.firstboot=off %KERNEL_PARAMS%

LABEL edex-os-serial
TEXT HELP
Boot with a serial console on ttyS0 (used by the automated tests).
ENDTEXT
MENU LABEL eDEX-OS live - serial console
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 edex.ci systemd.firstboot=off %KERNEL_PARAMS%
