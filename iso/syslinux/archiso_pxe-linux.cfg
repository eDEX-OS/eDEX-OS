LABEL edex-os-pxe-nbd
TEXT HELP
Boot eDEX-OS over the network with NBD (needs the archiso_pxe_nbd hook and a server).
ENDTEXT
MENU LABEL eDEX-OS live (%ARCH%, PXE, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD ::/%INSTALL_DIR%/boot/intel-ucode.img,::/%INSTALL_DIR%/boot/amd-ucode.img,::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nbd_srv=${pxeserver} %KERNEL_PARAMS%
SYSAPPEND 3

LABEL edex-os-pxe-http
MENU LABEL eDEX-OS live (%ARCH%, PXE, HTTP)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD ::/%INSTALL_DIR%/boot/intel-ucode.img,::/%INSTALL_DIR%/boot/amd-ucode.img,::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archiso_http_srv=http://${pxeserver}/ %KERNEL_PARAMS%
SYSAPPEND 3
