# Live medium initramfs (eDEX-OS): archiso hooks plus Plymouth for the boot splash. PXE hooks are
# left out (they need nbd/nfs tooling the medium does not ship). No `kms` hook: it copied every GPU
# driver and its firmware into the initramfs (~190 MB, duplicating the root image); GPU drivers load
# from the root filesystem instead and the splash uses the firmware framebuffer until then. Installed
# systems get the stock mkinitcpio configuration (with kms).
MODULES=(virtio_gpu)
HOOKS=(base udev plymouth microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
