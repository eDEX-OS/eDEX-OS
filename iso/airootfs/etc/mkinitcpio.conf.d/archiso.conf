# Live medium initramfs (eDEX-OS): archiso hooks plus Plymouth for the boot splash. PXE hooks are
# left out (they need nbd/nfs tooling the medium does not ship).
MODULES=(virtio_gpu)
HOOKS=(base udev plymouth microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
