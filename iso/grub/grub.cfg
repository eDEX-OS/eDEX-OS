# eDEX-OS live medium GRUB configuration (UEFI). Placeholders are substituted by mkarchiso.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod exfat
insmod udf
insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu

set gfxmode=auto
set gfxpayload=keep
if loadfont "${prefix}/fonts/unicode.pf2"; then
    terminal_output gfxterm
fi
loadfont "${prefix}/fonts/dejavu_sans_mono_14.pf2"
loadfont "${prefix}/fonts/dejavu_sans_mono_18.pf2"
loadfont "${prefix}/fonts/dejavu_sans_mono_24.pf2"
if [ -f "${prefix}/themes/edex-os/theme.txt" ]; then
    set theme="${prefix}/themes/edex-os/theme.txt"
    export theme
fi

# Serial console for automated tests (harmless on real hardware).
insmod serial
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
else
    archiso_platform='BIOS'
fi

set default=edex-os
set timeout=10
set timeout_style=menu

menuentry "eDEX-OS live (%ARCH%, ${archiso_platform})" --class edex-os --class gnu-linux --class os --id 'edex-os' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_priority=3 %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "eDEX-OS live — copy to RAM (remove the medium after boot)" --class edex-os --class gnu-linux --class os --id 'edex-os-copytoram' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram quiet splash loglevel=3 %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "eDEX-OS live — safe graphics (nomodeset)" --class edex-os --class gnu-linux --class os --id 'edex-os-nomodeset' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "eDEX-OS live — serial console (ttyS0)" --class edex-os --class gnu-linux --class os --id 'edex-os-serial' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 edex.ci %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Memtest86+ (RAM test)' --class memtest86 --class memtest --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Memtest86+ (RAM test)' --class memtest86 --class memtest --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ -f "/shellx64.efi" ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    fi
    menuentry 'UEFI firmware settings' --class efi --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Reboot' --class reboot --class restart {
    reboot
}

menuentry 'Power off' --class shutdown --class poweroff {
    halt
}
