---
units:
  - name: NetworkManager.service
    action: enable
    mandatory: true
  - name: greetd.service
    action: enable
    mandatory: true
  - name: tailscaled.service
    action: enable
    mandatory: true
  - name: nftables.service
    action: enable
    mandatory: true
  - name: dnscrypt-proxy.socket
    action: enable
    mandatory: true
  - name: edex-tor-mode.service
    action: enable
    mandatory: true
  - name: edex-tailscale-operator.service
    action: enable
    mandatory: true
  - name: bluetooth.service
    action: enable
    mandatory: false
  - name: power-profiles-daemon.service
    action: enable
    mandatory: false
  - name: accounts-daemon.service
    action: enable
    mandatory: false
  - name: systemd-timesyncd.service
    action: enable
    mandatory: false
  - name: fstrim.timer
    action: enable
    mandatory: false
  - name: pacman-init.service
    action: disable
    mandatory: false
  - name: edex-setup-live.service
    action: disable
    mandatory: false
  - name: edex-ci-report.service
    action: disable
    mandatory: false
  - name: edex-ci-install.service
    action: disable
    mandatory: false
  - name: systemd-networkd.service
    action: disable
    mandatory: false
  - name: systemd-networkd-wait-online.service
    action: disable
    mandatory: false
  - name: systemd-resolved.service
    action: disable
    mandatory: false
  - name: graphical.target
    action: enable
    mandatory: true
