---
# Plymouth for the splash; the archiso hooks are removed by shellprocess@kernel beforehand.
source: "/etc/mkinitcpio.conf"
useSystemdHook: false
hooks:
  prepend: []
  append: [ plymouth ]
  remove: [ archiso, archiso_loop_mnt, archiso_pxe_common, archiso_pxe_nbd, archiso_pxe_http, archiso_pxe_nfs, memdisk ]
