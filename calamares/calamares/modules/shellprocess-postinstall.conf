---
# Runs inside the installed system (chroot) after the bootloader. Up to 45 min: it may download
# hardware drivers with chwd (see edex-gpu-drivers).
dontChroot: false
timeout: 2700
i18n:
  name: "Finishing the eDEX-OS installation (hardware drivers)"
script:
  - command: "/usr/share/edex-os/install-steps/80-postinstall.sh"
    timeout: 2700
