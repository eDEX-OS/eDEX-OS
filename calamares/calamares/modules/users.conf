---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: false
    system: true
  - name: video
    must_exist: false
    system: true
  - name: audio
    must_exist: false
    system: true
  - name: input
    must_exist: false
    system: true
  - name: storage
    must_exist: false
    system: true
  - name: network
    must_exist: false
    system: true
  - name: rfkill
    must_exist: false
    system: true
  - name: lp
    must_exist: false
    system: true
  - name: tor
    must_exist: true
    system: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
doReusePassword: true
passwordRequirements:
  minLength: 8
  maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /usr/bin/fish
  forbidden_names: [ root, nobody, liveuser, greeter, tor ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "edex-${cpu}"
  forbidden_names: [ localhost ]
