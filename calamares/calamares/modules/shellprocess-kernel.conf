---
# Runs on the live system (dontChroot) between mount/unpackfs and initcpio: turns the copied
# live tree into an installable one (stock mkinitcpio preset, no archiso config, kernel in /boot).
dontChroot: true
timeout: 600
i18n:
  name: "Preparing the kernel and initramfs"
script:
  - command: "/usr/share/edex-os/install-steps/20-kernel.sh ${ROOT}"
    timeout: 600
