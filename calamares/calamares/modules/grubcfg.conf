---
overwrite: false
keep_distributor: false
defaults:
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: "saved"
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: "gfxterm"
  GRUB_DISABLE_RECOVERY: true
  GRUB_THEME: "/usr/share/grub/themes/edex-os/theme.txt"
  GRUB_GFXMODE: "auto"
  GRUB_GFXPAYLOAD_LINUX: "keep"
  GRUB_DISABLE_OS_PROBER: false
  GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash loglevel=3 rd.udev.log_priority=3 nowatchdog"
