# eDEX-OS Calamares configuration. Launched by `edex-install` as
#   calamares -c /etc/edex-os/calamares
# so it never collides with the CachyOS configuration shipped in /etc/calamares.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id:     kernel
    module: shellprocess
    config: shellprocess-kernel.conf
  - id:     postinstall
    module: shellprocess
    config: shellprocess-postinstall.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - luksopenswaphookcfg
    - shellprocess@kernel
    - initcpiocfg
    - initcpio
    - users
    - networkcfg
    - hwclock
    - services-systemd
    - grubcfg
    - bootloader
    # Post-install runs from edex-os-calamares-config, so the live-only packages
    # (including that one) are removed only afterwards.
    - shellprocess@postinstall
    - packages
    - removeuser
    - umount
  - show:
    - finished

branding: edex-os
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
