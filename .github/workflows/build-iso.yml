name: Build ISO

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  build-iso:
    name: Build ISO (Arch container)
    runs-on: ubuntu-24.04
    outputs:
      iso_name: ${{ steps.version.outputs.iso_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Version
        id: version
        run: |
          V=$(date +%Y.%m.%d)
          [[ "$GITHUB_REF" == refs/tags/* ]] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "iso_name=edex-os-x86_64-$V.iso" >> "$GITHUB_OUTPUT"

      - name: Build packages and ISO
        run: |
          sudo modprobe loop
          docker run --rm --privileged --device /dev/fuse -v "$PWD:/workspace" -w /workspace \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" archlinux:latest \
            bash -c 'git config --global --add safe.directory "*" && bash scripts/ci-build-iso.sh'
          sudo chown -R "$USER:$USER" out/

      - name: Rename and checksum
        run: |
          cd out
          ISO=$(ls edex-os-*.iso | head -1)
          NEW="${{ steps.version.outputs.iso_name }}"
          [ "$ISO" = "$NEW" ] || mv "$ISO" "$NEW"
          rm -f ./*.sha256 ./*.sha512
          sha256sum "$NEW" > "$NEW.sha256"
          sha512sum "$NEW" > "$NEW.sha512"
          tar -czf "edex-os-repo-${{ steps.version.outputs.version }}.tar.gz" -C repo .
          cat "$NEW.sha256"

      - name: GPG sign (tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "no GPG key configured; skipping"; exit 0; }
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd out
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor "${{ steps.version.outputs.iso_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: edex-os-iso
          path: |
            out/*.iso
            out/*.sha256
            out/*.sha512
            out/*.asc
            out/*.tar.gz
          retention-days: 14

  test-boot:
    name: Boot test (${{ matrix.mode }})
    needs: build-iso
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [uefi, bios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edex-os-iso
          path: out/
      - name: QEMU
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 ovmf
          sudo chmod a+rw /dev/kvm || true
      - name: Boot and check markers
        run: scripts/test-iso.sh --mode ${{ matrix.mode }} --timeout 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-log-${{ matrix.mode }}
          path: out/test/*.log

  test-install:
    name: Unattended install test
    needs: build-iso
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edex-os-iso
          path: out/
      - name: QEMU
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf libarchive-tools p7zip-full
          sudo chmod a+rw /dev/kvm || true
      - name: Install to a virtual disk and boot it
        run: scripts/test-install.sh --timeout 1500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-logs
          path: out/test/*.log
