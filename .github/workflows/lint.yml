name: Lint

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      # nft -c needs CAP_NET_ADMIN (in the container's own network namespace) to check rulesets.
      options: --cap-add=NET_ADMIN
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git shellcheck yamllint nftables python >/dev/null
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: scripts/lint.sh
